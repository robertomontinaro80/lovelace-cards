alias: Christmas - advent calendar phrase generator
description: Genera automaticamente la frase del giorno
triggers:
  - trigger: time
    at: '00:05:00'
conditions:
  - condition: template
    value_template: |
      {{ now().month == 12 and 1 <= now().day <= 25 }}
actions:
  - action: script.advent_generate_phrase
    data:
      day: '{{ now().day }}'
    enabled: true
  - action: script.advent_generate_phrase
    data:
      day: '{{ 24 }}'
    enabled: false
mode: single
